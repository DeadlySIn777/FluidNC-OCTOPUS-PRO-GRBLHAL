; ═══════════════════════════════════════════════════════════════════════════
; PlatformIO Configuration - BTT Octopus Pro (STM32F429)
; For use with grblHAL
; ═══════════════════════════════════════════════════════════════════════════
;
; MR-1 USAGE:
; 1. Read mr1/COMMISSIONING.md and mr1/WIRING.md before connecting hardware.
; 2. Validate: python tools/validate_mr1_profile.py
; 3. Build only: pio run -e btt_octopus_pro_f429_mr1
; 4. Normal flashing uses a FAT32 microSD containing the resulting firmware.bin.
;    Do not use the legacy environments or direct-motion diagnostic scripts for MR-1.
;
; BOARD VERSIONS:
; - v1.0.1: Uses F429, original pinout
; - v1.1: Can use F429 or F446, modified pinout (handled by board map)
;
; ═══════════════════════════════════════════════════════════════════════════

[platformio]
include_dir = Inc
src_dir = Src
default_envs = btt_octopus_pro_f429_mr1
boards_dir = boards

[common]
build_flags =
  -I .
  -I boards
  -I FatFs
  -I FatFs/STM
  -I Drivers/FATFS/Target
  -I Middlewares/ST/STM32_USB_Device_Library/Class/CDC/Inc
  -I Middlewares/ST/STM32_USB_Device_Library/Core/Inc
  -I USB_DEVICE/App
  -I USB_DEVICE/Target
  -D _USE_IOCTL=1
  -D _USE_WRITE=1
  -D _VOLUMES=1
  -Wl,-u,_printf_float
  -Wl,-u,_scanf_float
  -D OVERRIDE_MY_MACHINE

lib_deps =
  boards
  bluetooth
  grbl
  keypad
  laser
  motors
  trinamic
  odometer
  fans
  spindle
  embroidery
  Drivers/FATFS/App
  Drivers/FATFS/Target
  Middlewares/ST/STM32_USB_Device_Library/Core
  Middlewares/ST/STM32_USB_Device_Library/Class
  USB_DEVICE/App
  USB_DEVICE/Target
  FatFs
  sdcard

lib_extra_dirs =
  .
  boards
  FatFs
  Middlewares/ST/STM32_USB_Device_Library
  USB_DEVICE

[env]
platform = ststm32
platform_packages = framework-stm32cubef4 @ ~1.26.2
framework = stm32cube
lib_archive = no
lib_ldf_mode = off

; ---------------------------------------------------------------------------
; Langmuir MR-1 - Octopus Pro v1.1 STM32F429
; Phase one: stock motors + external DM860T V3.0 drives.
; Final motion upgrade: external CL57T V4.1 closed-loop axes.
; ---------------------------------------------------------------------------
[env:btt_octopus_pro_f429_mr1]
board = genericSTM32F429ZG
board_build.mcu = stm32f429zgt6
board_build.ldscript = STM32F429ZGTX_BL32K_I2C_FLASH.ld

build_flags = ${common.build_flags}
  -D BOARD_BTT_OCTOPUS_PRO_MR1=
  -D STM32F429xx
  -D HSE_VALUE=8000000
  -D HAS_BOOTLOADER
  -D VECT_TAB_OFFSET=0x8000
  -include Inc/mr1_octopus_config.h

; Keep the production image free of unrelated legacy plugins. Headers for the
; MR-1 board map come from -I boards; no generic board implementation is linked.
lib_deps =
  grbl
  spindle
  eeprom
  Middlewares/ST/STM32_USB_Device_Library/Core
  Middlewares/ST/STM32_USB_Device_Library/Class
  USB_DEVICE/App
  USB_DEVICE/Target

lib_extra_dirs = ${common.lib_extra_dirs}
; Build a raw image for the stock 32 KiB SD bootloader. Recovery DFU is manual.
upload_protocol = custom

; ---------------------------------------------------------------------------
; LAB ONLY - coordinated spindle-servo A axis plus Z for rigid-tap proof
;
; This image is deliberately separate from the production target. It disables
; the PWM spindle command and exposes the servo pulse/direction command as A.
; MOTOR4 carries A while MOTOR3 remains the auto-squared Y-right motor.
; DO NOT FLASH until every gate in mr1/servo-axis-tapping.pending.json passes.
; ---------------------------------------------------------------------------
[env:btt_octopus_pro_f429_mr1_servo_axis_lab]
board = genericSTM32F429ZG
board_build.mcu = stm32f429zgt6
board_build.ldscript = STM32F429ZGTX_BL32K_I2C_FLASH.ld

build_flags = ${common.build_flags}
  -D BOARD_BTT_OCTOPUS_PRO_MR1=
  -D STM32F429xx
  -D HSE_VALUE=8000000
  -D HAS_BOOTLOADER
  -D VECT_TAB_OFFSET=0x8000
  -include Inc/mr1_servo_axis_lab_config.h

lib_deps =
  grbl
  spindle
  eeprom
  Middlewares/ST/STM32_USB_Device_Library/Core
  Middlewares/ST/STM32_USB_Device_Library/Class
  USB_DEVICE/App
  USB_DEVICE/Target

lib_extra_dirs = ${common.lib_extra_dirs}
upload_protocol = custom

; ---------------------------------------------------------------------------
; LEGACY TARGETS BELOW - NOT APPROVED FOR THE MR-1
; The generic maps have different pins, safety defaults, linker layouts, and
; spindle assumptions. They remain for their original projects only.
; ---------------------------------------------------------------------------

; ═══════════════════════════════════════════════════════════════════════════
; BTT Octopus Pro v1.1 - STM32F429ZGT6 - TMC2209 UART
; CUSTOM: Motors in SLOTS 3, 4, 5 (not 1, 2, 3!)
; ═══════════════════════════════════════════════════════════════════════════
[env:btt_octopus_pro_f429]
board = genericSTM32F429ZG
board_build.mcu = stm32f429zgt6
board_build.ldscript = STM32F429VGTX_FLASH.ld

build_flags = ${common.build_flags}
  ; ═══════════════════════════════════════════════════════════════════════════
  ; CUSTOM BOARD MAP: Motors in Slots 3, 4, 5
  ; ═══════════════════════════════════════════════════════════════════════════
  ; Slot 3 = X axis
  ; Slot 4 = Y axis
  ; Slot 5 = Z axis
  -D BOARD_BTT_OCTOPUS_PRO_SLOTS345=
  -D STM32F429xx
  -D HSE_VALUE=8000000
  
  ; --- USB Serial ---
  -D USB_SERIAL_CDC=1
  
  ; --- SD Card (SDIO) ---
  -D SDCARD_ENABLE=1
  
  ; --- EEPROM (32Kbit I2C) ---
  -D EEPROM_ENABLE=32
  
  ; --- Probe ---
  -D PROBE_ENABLE=1
  
  ; --- Extra Motors ---
  ; Enable additional axes beyond XYZ
  ; M3 slot (Motor 4) = A axis
  ; M4 slot (Motor 5) = B axis  
  ; M5 slot (Motor 6) = C axis
  -D N_ABC_MOTORS=2              ; Enable A and B axes (5 motors total)
  
  ; --- TMC2209 via UART ---
  -D TRINAMIC_ENABLE=2209
  -D TRINAMIC_UART_ENABLE=2
  
  ; === CRITICAL: Enable ALL TMC2209 Features ===
  ; Dynamic current control - reduces current when axes are idle (saves power, reduces heat)
  -D TRINAMIC_DYNAMIC_CURRENT=1
  ; Poll driver status for overtemperature and other warnings
  -D TRINAMIC_POLL_STATUS=1
  ; Report StallGuard values in real-time status
  -D TRINAMIC_SG_REPORT=1
  ; Enable extended settings for chopper tuning ($651-$663)
  -D TRINAMIC_EXTENDED_SETTINGS=1
  
  ; === Chopper Mode: SpreadCycle for CNC (more torque than StealthChop) ===
  ; 0 = SpreadCycle (more torque, slight noise)
  ; 1 = StealthChop (quiet, less torque at high speeds)
  -D TMC_STEALTHCHOP=0
  
  ; === Chopper Tuning for NEMA17 60Ncm @ 24V ===
  ; TOFF: Off-time (1-15), affects switching frequency. 3-4 is typical
  -D TMC_CHOPCONF_TOFF=4
  ; TBL: Blanking time (0-3). 1=24 clocks is typical
  -D TMC_CHOPCONF_TBL=1
  ; HSTRT: Hysteresis start (1-8). Higher = more torque ripple but less noise
  -D TMC_CHOPCONF_HSTRT=4
  ; HEND: Hysteresis end (-3 to 12). Tune for smooth operation
  -D TMC_CHOPCONF_HEND=0
  ; INTPOL: Interpolation to 256 microsteps (always enable for TMC)
  -D TMC_CHOPCONF_INTPOL=1
  
  ; === CoolStep: Automatic Current Reduction Under Light Load ===
  ; SEMIN: Lower threshold to increase current (0=off, 1-15=enabled)
  -D TMC_COOLCONF_SEMIN=2
  ; SEMAX: Upper threshold (0-15)
  -D TMC_COOLCONF_SEMAX=5
  ; SEUP: Current increment step (0-3, maps to 1-8)
  -D TMC_COOLCONF_SEUP=1
  ; SEDN: Current decrement speed (0-3)
  -D TMC_COOLCONF_SEDN=1
  ; SEIMIN: Minimum current factor (0=1/2, 1=1/4)
  -D TMC_COOLCONF_SEIMIN=0
  
  ; === Physical Endstops (NOT sensorless homing) ===
  ; You have physical endstops, so sensorless homing is disabled
  ; But StallGuard is still available for load monitoring via M122 S1
  -D SENSORLESS_HOMING_ENABLE=0
  
  ; === TMC2209 Current Settings for NEMA17 60Ncm motors @ 24V ===
  ; Motor specs: 2.1A rated, 1.7Ω, 200 steps/rev
  ; BTT TMC2209 v1.3 uses 75mΩ sense resistors (NOT 110mΩ like v1.2!)
  ; With 75mΩ: Max RMS = 0.325V / (0.075Ω * √2) ≈ 3.06A theoretical
  ; But TMC2209 chip max is 2.0A RMS, so we're limited to ~2000mA
  -D TRINAMIC_R_SENSE=75
  -D DEFAULT_X_CURRENT=2000
  -D DEFAULT_Y_CURRENT=2000
  -D DEFAULT_Z_CURRENT=2000
  ; Hold current percentage (applied via TRINAMIC_DYNAMIC_CURRENT)
  ; 50% is standard, saves power when stationary
  -D TMC_X_HOLD_CURRENT_PCT=50
  -D TMC_Y_HOLD_CURRENT_PCT=50
  -D TMC_Z_HOLD_CURRENT_PCT=50
  ; Microsteps: 16 (interpolated to 256 by TMC)
  -D DEFAULT_X_MICROSTEPS=16
  -D DEFAULT_Y_MICROSTEPS=16
  -D DEFAULT_Z_MICROSTEPS=16
  -D DEFAULT_A_MICROSTEPS=16
  -D DEFAULT_B_MICROSTEPS=16
  
  ; --- Steps per mm (8mm lead screw) ---
  ; (200 steps * 16 microsteps) / 8mm = 400 steps/mm
  -D DEFAULT_X_STEPS_PER_MM=400.0f
  -D DEFAULT_Y_STEPS_PER_MM=400.0f
  -D DEFAULT_Z_STEPS_PER_MM=400.0f
  -D DEFAULT_A_STEPS_PER_MM=400.0f
  -D DEFAULT_B_STEPS_PER_MM=400.0f
  
  ; --- Max feed rates mm/min ---
  -D DEFAULT_X_MAX_RATE=5000.0f
  -D DEFAULT_Y_MAX_RATE=5000.0f
  -D DEFAULT_Z_MAX_RATE=2000.0f
  -D DEFAULT_A_MAX_RATE=5000.0f
  -D DEFAULT_B_MAX_RATE=5000.0f
  
  ; --- Acceleration mm/s² ---
  -D DEFAULT_X_ACCELERATION=400.0f
  -D DEFAULT_Y_ACCELERATION=400.0f
  -D DEFAULT_Z_ACCELERATION=250.0f
  -D DEFAULT_A_ACCELERATION=400.0f
  -D DEFAULT_B_ACCELERATION=400.0f
  
  ; --- Max travel mm ---
  -D DEFAULT_X_MAX_TRAVEL=350.0f
  -D DEFAULT_Y_MAX_TRAVEL=1200.0f
  -D DEFAULT_Z_MAX_TRAVEL=120.0f
  -D DEFAULT_A_MAX_TRAVEL=1200.0f
  -D DEFAULT_B_MAX_TRAVEL=1200.0f
  
  ; --- Soft Limits ---
  ; DISABLED by default for testing - enable after homing is configured
  -D DEFAULT_SOFT_LIMIT_ENABLE=0
  
  ; --- Homing ---
  ; DISABLED by default for testing - enable once limit switches are wired
  -D DEFAULT_HOMING_ENABLE=0
  
  ; --- Invert Limit Signals ---
  ; BTT Octopus Pro limit inputs are normally LOW (floating with pulldown)
  ; Must invert so HIGH = triggered (when switch closes to VCC)
  -D DEFAULT_INVERT_LIMIT_PINS=7
  
  ; --- Spindle: Simple PWM (VFD will be controlled via PC/USB) ---
  ; SPINDLE_PWM0 = 1 (basic PWM spindle - just outputs PWM, no MODBUS)
  -D SPINDLE0_ENABLE=1
  -D N_SPINDLE=1
  ; === EXPLICITLY DISABLE VFD/MODBUS ===
  ; PC will control VFD via USB adapter (COM6)
  ; grblHAL only handles motion, not spindle control
  -D VFD_ENABLE=0
  -D MODBUS_ENABLE=0
  
  ; ═══════════════════════════════════════════════════════════════════════════
  ; CONTROL INPUTS - ALL DISABLED (no physical switches connected)
  ; ═══════════════════════════════════════════════════════════════════════════
  ; If you have NOTHING connected, these pins float and trigger false alarms
  ; DISABLE all of them for now - enable when you wire switches
  
  -D ESTOP_ENABLE=0                  ; No E-Stop button connected
  -D SAFETY_DOOR_ENABLE=0            ; No safety door switch connected
  -D CONTROL_ENABLE=0                ; Disables Reset, Feed Hold, Cycle Start inputs
  
  ; === INVERT CONTROL SIGNALS (for when you DO connect them) ===
  ; If using NC (Normally Closed) switches, set to 1 to invert
  ; NC switches are SAFER: wire break = triggered
  ; 0 = Active LOW (NO switches, close to GND = triggered)
  ; 1 = Active HIGH (NC switches, open = triggered)
  -D DEFAULT_INVERT_CONTROL_PINS=0
  
  ; === PROBE INPUT ===
  ; Probe input is still enabled (PROBE_ENABLE=1 above)
  ; Invert probe if floating triggers false positive
  ; 0 = Active LOW (touch = connect to GND)
  ; 1 = Active HIGH (touch = connect to VCC)
  -D DEFAULT_INVERT_PROBE_PIN=1      ; Inverted so floating = NOT triggered
  
  ; === LIMIT SWITCHES ===
  ; Already set above: -D DEFAULT_INVERT_LIMIT_PINS=7
  ; This inverts all 3 axes (1+2+4=7)
  ; Floating/open = NOT triggered, closed to GND = triggered
  
  ; === SETTINGS VERSION ===
  ; Increment this to force EEPROM to reload defaults with new inversion settings
  -D SETTINGS_VERSION=100

lib_deps = ${common.lib_deps}
  eeprom

lib_extra_dirs = ${common.lib_extra_dirs}
upload_protocol = dfu

; ═══════════════════════════════════════════════════════════════════════════
; BTT Octopus Pro - STM32F429 - Standalone Mode (No UART)
; Use if TMC drivers are in standalone mode
; ═══════════════════════════════════════════════════════════════════════════
[env:btt_octopus_pro_f429_standalone]
board = genericSTM32F429ZG
board_build.mcu = stm32f429zgt6
board_build.ldscript = STM32F429VGTX_FLASH.ld

build_flags = ${common.build_flags}
  -D BOARD_BTT_OCTOPUS_PRO=
  -D STM32F429xx
  -D HSE_VALUE=8000000
  -D USB_SERIAL_CDC=1
  -D SDCARD_ENABLE=1
  -D EEPROM_ENABLE=32
  -D PROBE_ENABLE=1
  -D TRINAMIC_ENABLE=0
  -D DEFAULT_SOFT_LIMIT_ENABLE=1
  -D DEFAULT_HOMING_ENABLE=0
  ; --- Spindle: H100 VFD via MODBUS RS485 ---
  -D SPINDLE0_ENABLE=6
  -D N_SPINDLE=1
  -D MODBUS_ENABLE=1
  -D VFD_ENABLE=1
  -D ESTOP_ENABLE=0
  -D SAFETY_DOOR_ENABLE=0
  -D CONTROL_ENABLE=0

lib_deps = ${common.lib_deps}
  eeprom

lib_extra_dirs = ${common.lib_extra_dirs}
upload_protocol = dfu

