name: MR1 source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  firmware-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test actual alarm module without controller hardware
        working-directory: grblHAL-STM32F4
        run: python tools/test_mr1_alarm.py --cc gcc

  windows-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mr1-control/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify exported firmware source and profiles
        working-directory: grblHAL-STM32F4
        run: |
          python tools/verify_source_export.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/validate_mr1_profile.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/validate_mr1_macros.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/test_mr1_workflows.py
      - name: Verify visual wiring data and rebuild
        run: |
          python tools/visual-wiring/cable-data.py --test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/visual-wiring/cable-data.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test tools/visual-wiring/model.test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/visual-wiring/build.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git diff --exit-code -- docs/wiring/visual
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/wiring-schematic/build_schematic.py --check
      - name: Check local import safeguards
        run: node --test tools/import-local-assets.test.mjs
      - name: Install pinned application dependencies
        working-directory: mr1-control
        run: npm ci
      - name: Build native application web assets
        working-directory: mr1-control
        run: npm run build
      - name: Test source and synthetic controllers
        working-directory: mr1-control
        run: npm test
